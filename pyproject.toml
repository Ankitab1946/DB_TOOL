[tool.poetry]
name = "data-dictionary-admin-app"
version = "2.0.0"
description = "PRJ Data Dictionary Administration Platform - raw/staging/final architecture"
authors = ["Data Dictionary Team"]
packages = [{ include = "DataDictionaryAdminApp", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
streamlit = "^1.40.0"
streamlit-modal = "^0.1.2"
sqlalchemy = "^2.0.0"
pyodbc = "^5.1.0"
psycopg = {extras = ["binary"], version = "^3.2.0"}
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
pyyaml = "^6.0.2"
pandas = "^2.2.0"
openpyxl = "^3.1.0"
boto3 = "^1.35.0"
requests = "^2.32.0"
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.6.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
